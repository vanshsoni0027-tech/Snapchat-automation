name: Snapchat 24-7 Story Automation

on:
  schedule:
    # Runs 5 times a day (02:00, 07:00, 12:00, 17:00, 22:00 UTC)
    - cron: '0 2,7,12,17,22 * * *'
  workflow_dispatch: # Allows one-click manual run from GitHub UI anytime

permissions:
  contents: write

jobs:
  post-story:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore Snapchat Session from Secret
        run: |
          echo "${{ secrets.SNAPCHAT_STATE_JSON }}" > state.json

      - name: Execute Automation Cycle
        run: |
          python main.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "vanshsoni0027-tech"
          git config --global user.email "vanshsoni0027@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
