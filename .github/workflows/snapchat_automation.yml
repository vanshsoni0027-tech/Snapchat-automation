name: Snapchat 3x Daily Automated Poster (Spotlight & Story)

on:
  schedule:
    # Run 1: ~10:05 AM IST (04:35 AM UTC) - offset from :30 to avoid queue lag
    - cron: '35 4 * * *'
    # Run 2: ~04:05 PM IST (10:35 AM UTC)
    - cron: '35 10 * * *'
    # Run 3: ~08:05 PM IST (02:35 PM UTC)
    - cron: '35 14 * * *'

  workflow_dispatch:
    inputs:
      posts_count:
        description: 'Number of posts to publish in this run'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore Snapchat Session
        run: |
          if [ -n "${{ secrets.SNAPCHAT_STATE_JSON }}" ]; then
            echo "${{ secrets.SNAPCHAT_STATE_JSON }}" > state.json
            echo "[+] state.json restored from GitHub Secret"
          elif [ -f state.json ]; then
            echo "[+] Using existing state.json in repository"
          fi

      - name: Run Auto Poster Pipeline
        env:
          SNAPCHAT_USERNAME: ${{ secrets.SNAPCHAT_USERNAME }}
          SNAPCHAT_PASSWORD: ${{ secrets.SNAPCHAT_PASSWORD }}
        run: |
          COUNT="${{ github.event.inputs.posts_count }}"
          if [ -n "$COUNT" ]; then
            python weekly_scheduler.py "$COUNT"
          else
            python weekly_scheduler.py
          fi

      - name: Commit and Push Updated History & Refreshed Session
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json state.json || true
          git diff --staged --quiet || (git commit -m "Auto Post: Updated history and refreshed session [skip ci]" && git push origin main) || echo "[i] No new changes to push"
