name: Snapchat 3x Daily Automated Poster (Spotlight & Story)

on:
  schedule:
    # Automated test triggers requested by user:
    - cron: '52 7 * * *'  # 07:52 UTC (01:22 PM IST)
    - cron: '55 7 * * *'  # 07:55 UTC (01:25 PM IST)
    - cron: '58 7 * * *'  # 07:58 UTC (01:28 PM IST)
    - cron: '2 8 * * *'   # 08:02 UTC (01:32 PM IST)
    - cron: '6 8 * * *'   # 08:06 UTC (01:36 PM IST)
    # 3 Daily Scheduled Slots (Offset by 15 mins to absorb GitHub queue delay):
    # Slot 1: ~10:00 AM IST (04:15 UTC) -> 7 posts
    - cron: '15 4 * * *'
    # Slot 2: ~04:00 PM IST (10:15 UTC) -> 7 posts
    - cron: '15 10 * * *'
    # Slot 3: ~08:00 PM IST (14:15 UTC) -> 6 posts
    - cron: '15 14 * * *'

  workflow_dispatch:
    inputs:
      posts_count:
        description: 'Number of posts to publish in this run'
        required: false
        default: '7'

  repository_dispatch:
    types: [auto_post]

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore Snapchat & Instagram Sessions
        run: |
          if [ -f state.json ]; then
            echo "[+] Using existing state.json in repository"
          elif [ -n "${{ secrets.SNAPCHAT_STATE_JSON }}" ]; then
            echo "${{ secrets.SNAPCHAT_STATE_JSON }}" > state.json
            echo "[+] state.json restored from GitHub Secret"
          fi
          if [ -f instagram_cookies.txt ]; then
            echo "[+] Using existing instagram_cookies.txt in repository"
          elif [ -n "${{ secrets.INSTAGRAM_COOKIES }}" ]; then
            echo "${{ secrets.INSTAGRAM_COOKIES }}" > instagram_cookies.txt
            echo "[+] instagram_cookies.txt restored from GitHub Secret"
          fi

      - name: Run Auto Poster Pipeline
        env:
          SNAPCHAT_USERNAME: ${{ secrets.SNAPCHAT_USERNAME }}
          SNAPCHAT_PASSWORD: ${{ secrets.SNAPCHAT_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          COUNT="${{ github.event.inputs.posts_count }}"
          if [ -n "$COUNT" ]; then
            python weekly_scheduler.py "$COUNT" 2>&1 | tee run.log
          else
            python weekly_scheduler.py 2>&1 | tee run.log
          fi

      - name: Upload Run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-poster-logs
          path: |
            run.log
            *.log
          retention-days: 7

      - name: Commit and Push Updated History & Refreshed Session
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json state.json instagram_cookies.txt || true
          git diff --staged --quiet || (git commit -m "Auto Post: Updated history, session, and cookies [skip ci]" && git push origin main) || echo "[i] No new changes to push"
